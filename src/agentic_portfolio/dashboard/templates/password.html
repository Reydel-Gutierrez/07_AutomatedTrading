{% extends "base.html" %}
{% block title %}Change Password · Agentic Portfolio{% endblock %}
{% block content %}
<section class="card login-box">
  <h2>Change password</h2>
  <p class="meta">{{ paper_book_label }} · {{ live_account_label }} · no live order placement</p>
  <form class="auth-form" method="post" action="{{ url_for('password_change') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="4">
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="4">
    <button class="btn" type="submit">Save and sign out</button>
  </form>
</section>
{% endblock %}
