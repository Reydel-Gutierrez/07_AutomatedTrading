[project]
name = "agentic-firm"
version = "2.0.0"
description = "Autonomous investment firm: CIO, managers, ledger, execution desk, Investment HQ."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<0.119",
    "uvicorn>=0.30,<0.38",
    "cryptography>=43,<47",
    "anthropic>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
